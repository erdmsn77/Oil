[package]
name = "oil-cli"
version.workspace = true
edition.workspace = true
description = "Terminal interface for Oil binary forensic triage engine"

[[bin]]
name = "oil"
path = "src/main.rs"

[dependencies]
oil-core = { path = "../oil-core" }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Terminal colors and styling
colored = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
winres = "0.1"
