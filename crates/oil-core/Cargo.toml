[package]
name = "oil-core"
version.workspace = true
edition.workspace = true
description = "Pure analysis engine library for Oil — zero UI, zero side-effects"

[dependencies]
# PE parsing (zero-copy, cross-platform)
goblin = "0.9"

# Dual hashing
sha2 = "0.10"
blake3 = "1"

# Multi-pattern string search (IOC extraction)
aho-corasick = "1"
regex = "1"

# Memory-mapped I/O for large files
memmap2 = "0.9"

# In-memory ZIP archive scanning
zip = { version = "2", default-features = false, features = ["deflate"] }

# x86/x64 instruction disassembler for semantic patch analysis
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "instr_info", "std"] }

# Serialization for report structures
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
