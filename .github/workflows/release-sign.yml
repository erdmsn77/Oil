name: Build and sign release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test workspace
        shell: pwsh
        run: cargo test --workspace

      - name: Build release binary
        shell: pwsh
        run: cargo build --release

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\oil.exe dist\oil.exe
          Get-FileHash dist\oil.exe -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  oil.exe"
          } | Set-Content dist\SHA256SUMS -Encoding ascii

      - name: Sign binary with Sigstore
        shell: pwsh
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob `
            --bundle dist\oil.exe.sigstore.json `
            dist\oil.exe

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/oil.exe
            dist/oil.exe.sigstore.json
            dist/SHA256SUMS
          generate_release_notes: true